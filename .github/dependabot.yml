version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      void:
        patterns: ["void", "@void/*"]
      vite-plus:
        patterns: ["vite", "vite-plus", "@voidzero-dev/vite-plus-*"]
      bun-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
